<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kartu Pintar Depan - Alif Setiawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 50: '#ecfdf5', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 840px;
      height: 530px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body class="flex items-center justify-center font-sans antialiased">
  
  <div class="w-[840px] h-[530px] bg-gradient-to-br from-slate-950 via-brand-900 to-emerald-950 relative overflow-hidden flex flex-col justify-between p-8 text-white border-2 border-emerald-500/30">
    
    <!-- Background Landscape Photo -->
    <div class="absolute inset-0 opacity-25 mix-blend-luminosity pointer-events-none">
      <img src="Asset Image/banner-tegalpingen.jpeg" alt="Jembatan Merah Tegalpingen" class="w-full h-full object-cover object-[center_50%]">
    </div>
    
    <!-- Radial Glow -->
    <div class="absolute -top-24 -right-24 w-80 h-80 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Row: Logo & Smart Chip -->
    <div class="relative z-10 flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-300 text-lg shadow-md">
          <i class="fa-solid fa-address-card"></i>
        </div>
        <div>
          <p class="text-xs font-black uppercase tracking-widest text-emerald-400">KARTU PINTAR WARGA</p>
          <p class="text-base font-black text-white">Desa Tegalpingen</p>
        </div>
      </div>

      <!-- Smart Chip Graphic -->
      <div class="w-14 h-11 rounded-lg bg-gradient-to-tr from-amber-400 via-yellow-200 to-amber-500 border border-amber-600/50 shadow-md flex items-center justify-center opacity-90">
        <div class="w-10 h-7 border border-amber-800/40 rounded grid grid-cols-2 gap-1 opacity-60"></div>
      </div>
    </div>

    <!-- Middle Row: Foto Profil & Identitas CaKades -->
    <div class="relative z-10 flex items-center gap-6 my-auto">
      <!-- Foto Avatar -->
      <div class="w-36 h-36 rounded-2xl border-4 border-amber-400 shadow-2xl overflow-hidden bg-slate-800 shrink-0 ring-4 ring-white/10">
        <img src="Asset Image/cakades.jpeg" alt="Alif Setiawan" class="w-full h-full object-cover object-[center_12%]">
      </div>

      <!-- Profil Info -->
      <div class="min-w-0">
        <span class="inline-block px-3 py-1 rounded-full bg-emerald-500/25 border border-emerald-400/40 text-xs font-black text-emerald-300 uppercase tracking-wider mb-1.5">
          Calon Kepala Desa
        </span>
        <h3 class="text-3xl font-black text-white leading-tight truncate tracking-tight">Alif Setiawan</h3>
        <p class="text-sm text-slate-300 font-semibold mt-0.5">Kecamatan Pengadegan, Purbalingga</p>
        
        <!-- Slogan Campaign Pill -->
        <div class="mt-3 inline-flex items-center gap-2 px-3 py-1 bg-amber-400/20 border border-amber-300/40 rounded-lg">
          <i class="fa-solid fa-quote-left text-xs text-amber-300"></i>
          <span class="text-xs font-black text-amber-300 uppercase tracking-wide">YANG MUDA BERKARYA, UNTUK MEMBANGUN DESA</span>
        </div>
      </div>
    </div>

    <!-- Bottom Row: Footer Branding -->
    <div class="relative z-10 flex items-center justify-between pt-3 border-t border-white/15 text-xs text-slate-400">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
        <span class="font-semibold">Layanan Cepat Tanggap 1 Pintu Warga</span>
      </span>
      <span class="font-extrabold text-emerald-400 uppercase tracking-wider">SiTapNext Digital</span>
    </div>

  </div>

</body>
</html>
